<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<!-- iOS PWA SAFE VIEWPORT -->
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<title>Goals</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f11">

<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">

<style>
:root{
  --bg:#0f0f11;
  --bg2:#18181c;
  --bg3:#22222a;
  --border:#2e2e38;
  --text:#f0f0f3;
  --muted:#7a7a8c;
  --faint:#3a3a48;
  --green:#22c97a;
  --red:#e05555;
  --amber:#f0a040;
  --blue:#5b9cf6;
  --radius:14px;
  --radius-sm:9px;
  --nav-h:64px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  height:100%;
  background:var(--bg);
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  overflow-x:hidden;
  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  padding-bottom:
    calc(
      var(--nav-h)
      + env(safe-area-inset-bottom)
    );
}

.shell{
  max-width:480px;
  margin:0 auto;
}

/* HEADER */

.header{
  padding:
    calc(40px + env(safe-area-inset-top))
    20px
    10px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header h1{
  font-size:24px;
  font-weight:700;
}

.header-date{
  color:var(--muted);
  font-size:13px;
  margin-top:2px;
}

.score-pill{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:999px;

  display:flex;
  align-items:center;
  gap:8px;

  padding:8px 14px;
}

.score-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
}

/* DAY NAV */

.day-nav{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 20px 16px;
}

.day-nav-btn{
  width:38px;
  height:38px;

  border:none;
  border-radius:12px;

  background:var(--bg2);
  color:var(--text);

  font-size:18px;
}

.day-label{
  flex:1;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

/* TABS */

.tab{
  display:block;

  padding:0 16px;

  visibility:hidden;
  opacity:0;

  height:0;
  overflow:hidden;

  pointer-events:none;
}

.tab.active{
  visibility:visible;
  opacity:1;

  height:auto;
  overflow:visible;

  pointer-events:auto;
}

/* CARDS */

.card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
}

.progress-big{
  font-size:30px;
  font-weight:700;
}

.progress-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.pbar-track{
  height:8px;
  background:var(--faint);
  border-radius:999px;
  margin-top:14px;
  overflow:hidden;
}

.pbar-fill{
  height:100%;
  width:0%;
  background:var(--green);
  border-radius:999px;
  transition:width .25s;
}

/* INPUTS */

input,
textarea,
select,
button{
  font-family:inherit;
  font-size:16px !important;
}

input[type=text],
input[type=number],
textarea,
select{
  width:100%;

  background:var(--bg2);
  color:var(--text);

  border:1px solid var(--border);
  border-radius:12px;

  outline:none;
}

input{
  height:48px;
  padding:0 14px;
}

textarea{
  min-height:120px;
  resize:none;
  padding:14px;
  line-height:1.5;
}

input::placeholder,
textarea::placeholder{
  color:var(--faint);
}

/* HABITS */

.habit-row{
  display:flex;
  align-items:center;
  gap:12px;

  background:var(--bg2);

  border:1px solid var(--border);
  border-radius:12px;

  padding:14px;
  margin-bottom:8px;

  user-select:none;
}

.habit-row.done{
  border-color:#1f4c38;
  background:#152118;
}

.chk{
  width:22px;
  height:22px;

  border-radius:50%;
  border:2px solid var(--faint);

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.habit-row.done .chk{
  background:var(--green);
  border-color:var(--green);
}

.chk i{
  color:#000;
  opacity:0;
  font-size:13px;
}

.habit-row.done .chk i{
  opacity:1;
}

.hname{
  flex:1;
}

.habit-row.done .hname{
  text-decoration:line-through;
  color:var(--muted);
}

/* ADD ROW */

.add-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.add-row button{
  border:none;
  background:var(--green);
  color:#000;

  border-radius:12px;

  padding:0 18px;

  font-weight:700;
}

/* NAV */

.bottom-nav{
  position:sticky;
  bottom:0;

  display:flex;

  border-top:1px solid var(--border);

  background:rgba(15,15,17,.96);
  backdrop-filter:blur(20px);

  padding-bottom:env(safe-area-inset-bottom);

  z-index:50;
}

.bnav-btn{
  flex:1;

  border:none;
  background:none;
  color:var(--muted);

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;

  padding:10px 0 8px;
}

.bnav-btn i{
  font-size:20px;
}

.bnav-btn.active{
  color:var(--text);
}

.bnav-btn.active i{
  color:var(--green);
}

.sec-title{
  color:var(--muted);
  font-size:12px;
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
</style>
</head>
<body>

<div class="shell">

  <div class="header">
    <div>
      <h1>Goals</h1>
      <div class="header-date" id="today-sub"></div>
    </div>

    <div class="score-pill">
      <div class="score-dot"></div>
      <span id="header-score">0%</span>
    </div>
  </div>

  <div class="day-nav">
    <button class="day-nav-btn" onclick="changeDay(-1)">
      <i class="ti ti-chevron-left"></i>
    </button>

    <div class="day-label" id="day-label"></div>

    <button class="day-nav-btn" onclick="changeDay(1)">
      <i class="ti ti-chevron-right"></i>
    </button>
  </div>

  <!-- TODAY TAB -->

  <div class="tab active" id="tab-today">

    <div class="card">
      <div class="progress-big" id="score-pts">0 pts</div>
      <div class="progress-sub" id="score-frac">0 / 0 habits</div>

      <div class="pbar-track">
        <div class="pbar-fill" id="pbar"></div>
      </div>
    </div>

    <div class="sec-title">Habits</div>

    <div id="habit-list"></div>

    <div class="card">

      <div class="sec-title">Add Habit</div>

      <div class="add-row">
        <input
          type="text"
          id="new-habit"
          placeholder="Habit name"
        >

        <button onclick="addHabit()">
          Add
        </button>
      </div>

    </div>

    <div class="card">

      <div class="sec-title">Journal</div>

      <textarea
        id="journal"
        placeholder="How was today?"
      ></textarea>

    </div>

  </div>

</div>

<nav class="bottom-nav">

  <button
    class="bnav-btn active"
    onclick="switchTab('today',this)"
  >
    <i class="ti ti-checkbox"></i>
    Today
  </button>

</nav>

<script>
let habits = [
  {
    id:1,
    text:"Exercise"
  },
  {
    id:2,
    text:"Read"
  }
];

let checked = {};

function renderHabits(){

  const list =
    document.getElementById("habit-list");

  list.innerHTML = "";

  habits.forEach(h=>{

    const row =
      document.createElement("div");

    row.className =
      "habit-row"
      + (checked[h.id] ? " done" : "");

    row.innerHTML = `
      <div class="chk">
        <i class="ti ti-check"></i>
      </div>

      <div class="hname">
        ${h.text}
      </div>
    `;

    row.onclick = ()=>{

      checked[h.id] = !checked[h.id];

      renderHabits();
      updateScore();
    };

    list.appendChild(row);
  });
}

function updateScore(){

  let done =
    Object.values(checked)
    .filter(Boolean)
    .length;

  let total = habits.length;

  let pct =
    total
      ? Math.round(done / total * 100)
      : 0;

  document.getElementById("score-pts")
    .textContent =
      done + " pts";

  document.getElementById("score-frac")
    .textContent =
      done + " / " + total + " habits";

  document.getElementById("header-score")
    .textContent =
      pct + "%";

  document.getElementById("pbar")
    .style.width =
      pct + "%";
}

function addHabit(){

  const input =
    document.getElementById("new-habit");

  const text =
    input.value.trim();

  if(!text) return;

  habits.push({
    id:Date.now(),
    text
  });

  input.value = "";

  renderHabits();
  updateScore();
}

function switchTab(tab, btn){

  document
    .querySelectorAll(".bnav-btn")
    .forEach(b=>
      b.classList.remove("active")
    );

  btn.classList.add("active");

  document
    .querySelectorAll(".tab")
    .forEach(t=>
      t.classList.remove("active")
    );

  document
    .getElementById("tab-"+tab)
    .classList.add("active");
}

function changeDay(dir){
  console.log(dir);
}

/* iOS PWA KEYBOARD FIX */

function forceKeyboardFix(el){

  setTimeout(()=>{

    el.scrollIntoView({
      block:"center",
      behavior:"smooth"
    });

    requestAnimationFrame(()=>{
      el.focus();
    });

  },50);
}

document.addEventListener(
  "focusin",
  e=>{

    const el = e.target;

    if(
      el.tagName === "INPUT"
      || el.tagName === "TEXTAREA"
    ){
      forceKeyboardFix(el);
    }
  }
);

/* VISUAL VIEWPORT FIX */

if(window.visualViewport){

  window.visualViewport
    .addEventListener(
      "resize",
      ()=>{

        document.body.style.minHeight =
          window.visualViewport.height
          + "px";
      }
    );
}

/* DATE */

document.getElementById("today-sub")
.textContent =
  new Date().toLocaleDateString(
    "en-GB",
    {
      weekday:"long",
      day:"numeric",
      month:"long"
    }
  );

document.getElementById("day-label")
.textContent = "Today";

renderHabits();
updateScore();

/*
IMPORTANT:

DO NOT REGISTER SERVICE WORKER
UNTIL KEYBOARD ISSUE IS FIXED

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
*/
</script>

</body>
</html>
</html>
